name: Studio app (Android)

# Builds the private myProfile app for Android and publishes it as a GitHub
# Release, which the installed app finds and offers as an update (admin/update.js).
#  - Automatic: every push to main that changes the app's files releases the
#    next version (1.3.0 -> 1.3.1 ...). Put [no app] in a commit message to skip.
#  - For a bigger jump, raise "version" in app/package.json (e.g. 1.4.0); it is
#    used when it is higher than the last release.
#  - Or run it by hand from the Actions tab.
# Needs two repository secrets: STUDIO_KEYSTORE_BASE64 and STUDIO_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'lib/**'
      - 'worlds.js'
      - 'content.js'
      - 'assets/fonts/**'
      - 'app/native.js'
      - 'app/scripts/**'
      - 'app/package.json'
      - 'app/capacitor.config.json'
      - 'app/android/**'
      - '.github/workflows/studio-app.yml'

permissions:
  contents: write

concurrency:
  group: studio-release
  cancel-in-progress: false

jobs:
  android:
    if: ${{ !contains(github.event.head_commit.message, '[no app]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Pick the version and write the release notes
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'studio-v*' --sort=-v:refname | head -1)
          LASTV=${LAST#studio-v}; LASTV=${LASTV:-0.0.0}
          PKG=$(node -p "require('./package.json').version")
          HIGHER=$(printf '%s\n%s\n' "$PKG" "$LASTV" | sort -V | tail -1)
          if [ "$PKG" != "$LASTV" ] && [ "$HIGHER" = "$PKG" ]; then V=$PKG
          else IFS=. read -r MA MI PA <<< "$LASTV"; V="$MA.$MI.$((PA + 1))"; fi
          node -e "const f='package.json',p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          RANGE=${LAST:+$LAST..HEAD}
          git log ${RANGE:-HEAD~20..HEAD} --no-merges --pretty='- %s' -- ../admin ../lib ../app ../worlds.js ../content.js | grep -v '\[no app\]' | head -12 > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo '- Small fixes and improvements' > "$RUNNER_TEMP/notes.md"
          echo "Releasing $V (last: ${LAST:-none})"; cat "$RUNNER_TEMP/notes.md"
      - run: npm install --no-audit --no-fund
      - run: npm run sync
      # The same key every time, so a new APK installs over the old one.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::STUDIO_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/studio.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/studio.p12" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: studio
          ANDROID_KEY_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../../Studio-Android.apk
      - name: Check the signature
        working-directory: .
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs Studio-Android.apk | grep -i "SHA-1"
      - uses: actions/upload-artifact@v5
        with:
          name: Studio-Android
          path: Studio-Android.apk
      - name: Publish the release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## What's new"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Private owner app for the portfolio. Only the owner's Google account can sign in."
            echo
            echo "The installed app offers this update by itself. First install: download Studio-Android.apk below and open it (allow installing from your browser if asked). New versions install over the old one."
          } > "$RUNNER_TEMP/body.md"
          gh release create "studio-v$VERSION" Studio-Android.apk --target "$GITHUB_SHA" --title "myProfile $VERSION" --notes-file "$RUNNER_TEMP/body.md"
