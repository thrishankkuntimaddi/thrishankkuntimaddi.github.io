name: Studio app (Android)

# Builds the private Studio app for Android phones and tablets.
#  - Push a tag like studio-v1.0.1 (after raising "version" in app/package.json)
#    to publish Studio-Android.apk on a GitHub Release.
#  - Or run it by hand from the Actions tab (the APK is attached to the run).
# Needs two repository secrets: STUDIO_KEYSTORE_BASE64 and STUDIO_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
  push:
    tags: ['studio-v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run sync
      # The same key every time, so a new APK installs over the old one.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::STUDIO_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/studio.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/studio.p12" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: studio
          ANDROID_KEY_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../../Studio-Android.apk
      - name: Check the signature
        working-directory: .
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs Studio-Android.apk | grep -i "SHA-1"
      - uses: actions/upload-artifact@v5
        with:
          name: Studio-Android
          path: Studio-Android.apk
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Studio-Android.apk \
            --title "Studio ${GITHUB_REF_NAME#studio-v}" \
            --notes "Private owner app for the portfolio. Only thrishankkuntimaddi@gmail.com can sign in.

          Install on an Android phone or tablet: download Studio-Android.apk below and open it (allow installing from your browser if asked). New versions install over the old one."
